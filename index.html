<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Vista 3D Urban Decay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Full-bleed WebGL scene; thin instrument HUD pinned to the corners like a hazmat visor. Single dark look by design. */
:root{
  --ink:#f6d9c8; --dim:rgba(246,217,200,.62); --glass:rgba(28,8,6,.42); --line:rgba(255,128,90,.32); --hot:#ff5233; --amber:#ffb04a;
  --display:'Chakra Petch','Arial Narrow',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:#1a0705;color:var(--ink)}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:var(--mono)}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;cursor:grab}
#app canvas:active{cursor:grabbing}
.hud{position:fixed;pointer-events:none;z-index:2;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.brand{top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 16px);display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.18em}
.brand span{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.compass{top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);width:min(240px,40vw);height:34px;overflow:hidden;
  background:var(--glass);border:1px solid var(--line);border-radius:3px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.strip{position:absolute;top:0;left:0;height:100%;will-change:transform}
.strip span{position:absolute;top:0;transform:translateX(-50%);font-size:11px}
.strip .tick{top:4px;width:1px;height:6px;background:var(--dim)}
.strip .card{top:12px;font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink)}
.strip .card.n{color:var(--hot)}
.strip .ord{top:14px;font-size:10px;color:var(--dim)}
.needle{position:absolute;left:50%;top:0;width:2px;height:7px;margin-left:-1px;background:var(--hot)}
.deg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 50px);left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.1em;color:var(--dim);font-variant-numeric:tabular-nums}
.readout{left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);max-width:60vw}
.street{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-wrap:balance}
.sub{font-size:11px;color:var(--dim);margin-top:2px}
.dose{right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.dose .lbl{font-size:10px;letter-spacing:.16em;color:var(--dim)}
.dose .val{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.dose .val.hot{color:var(--hot)}
.dose .u{font-size:10px;color:var(--dim)}
.hint{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);
  padding:8px 12px;background:var(--glass);border:1px solid var(--line);border-radius:3px;font-size:11px;letter-spacing:.04em;text-align:center;transition:opacity .8s}
.hint.gone{opacity:0}
.reticle{left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(246,217,200,.5)}
.joy{position:fixed;z-index:3;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:1px solid var(--line);background:rgba(28,8,6,.25);pointer-events:none}
.joy .knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,120,80,.35);border:1px solid rgba(255,170,140,.6)}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:13px}
@media (max-width:420px){.brand span{display:none}.street{font-size:15px}}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>
</head>
<body>


<div id="app"></div>
<div class="hud brand"><b>VISTA 3D</b><span>build 01 · dead city</span></div>
<div class="hud compass"><div class="strip" id="strip"></div><i class="needle"></i></div>
<div class="hud deg" id="deg">000° N</div>
<div class="hud readout"><div class="street" id="street">Vista Ave</div><div class="sub" id="sub">&nbsp;</div></div>
<div class="hud dose"><span class="lbl">DOSE RATE</span><span class="val" id="dose">0.00</span><span class="u">mSv/h</span></div>
<div class="hud hint" id="hint"></div>
<div class="hud reticle"></div>
<div class="joy" id="joy" hidden><div class="knob" id="knob"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div class="err">The 3D engine failed to load. Reload the page to try again.</div>');return;}
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}
catch(e){document.body.insertAdjacentHTML('beforeend','<div class="err">This browser could not start WebGL, which the city needs to render.</div>');return;}

/* ---------- setup ---------- */
let seed=1337;
const rng=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=(a,b)=>a+rng()*(b-a), pick=a=>a[(rng()*a.length)|0], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const C=h=>new THREE.Color(h).convertSRGBToLinear();
const coarse=matchMedia('(pointer:coarse)').matches;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

renderer.setPixelRatio(Math.min(devicePixelRatio||1,coarse?1.6:2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('app').appendChild(renderer.domElement);

const scene=new THREE.Scene();
const FOG=C(0x6a2416);
scene.fog=new THREE.FogExp2(FOG,0.0095);
scene.background=FOG;
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,900);
camera.rotation.order='YXZ';

/* ---------- sky: low red sun through haze ---------- */
const sunDir=new THREE.Vector3(0.78,0.16,-0.6).normalize();
const sky=new THREE.Mesh(new THREE.SphereGeometry(600,32,16),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{sunDir:{value:sunDir},hor:{value:FOG},mid:{value:C(0x4a1410)},top:{value:C(0x140709)}},
  vertexShader:'varying vec3 vDir;void main(){vDir=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:`varying vec3 vDir;uniform vec3 sunDir,hor,mid,top;
  void main(){vec3 d=normalize(vDir);float y=d.y;
    vec3 c=mix(hor,mid,smoothstep(0.02,0.28,y));c=mix(c,top,smoothstep(0.25,0.9,y));
    float s=max(dot(d,sunDir),0.0);
    c+=vec3(1.0,0.28,0.10)*pow(s,6.0)*0.55*smoothstep(-0.05,0.1,y+0.05);
    c+=vec3(1.0,0.45,0.22)*pow(s,60.0)*0.9;
    c+=vec3(1.4,0.75,0.5)*smoothstep(0.9988,0.9994,s);
    if(y<0.0)c=hor;
    gl_FragColor=vec4(c,1.0);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }`
}));
sky.renderOrder=-1;
scene.add(sky);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(C(0xff7a52),C(0x2a100b),0.75));
const sun=new THREE.DirectionalLight(C(0xff6a3a),3.2);
sun.castShadow=true;
sun.shadow.mapSize.set(coarse?1024:2048,coarse?1024:2048);
Object.assign(sun.shadow.camera,{left:-75,right:75,top:75,bottom:-75,near:1,far:420});
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.06;
scene.add(sun,sun.target);

/* ---------- textures ---------- */
function canvasTex(size,draw){const c=document.createElement('canvas');c.width=c.height=size;draw(c.getContext('2d'),size);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;}
function speckle(x,s,n,a){for(let i=0;i<n;i++){const v=(rng()*60)|0;x.fillStyle=`rgba(${v},${v*.8|0},${v*.7|0},${a*rng()})`;x.fillRect(rng()*s,rng()*s,1+rng()*2,1+rng()*2);}}
const winTex=canvasTex(128,(x,s)=>{
  x.fillStyle='#a39389';x.fillRect(0,0,s,s);speckle(x,s,2600,.35);
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const X=8+c*30,Y=10+r*30,k=rng();
    x.fillStyle=k<.66?'#1d1412':k<.88?'#070404':k<.95?'#5d4c42':'#c4461c';
    x.fillRect(X,Y,18,18);
    if(k>=.66&&k<.88){x.fillStyle='#a39389';x.beginPath();x.moveTo(X,Y+18);x.lineTo(X+6+rng()*8,Y+10+rng()*8);x.lineTo(X+18,Y+18);x.fill();}
    x.fillStyle='rgba(220,200,185,.35)';x.fillRect(X-1,Y+18,20,2);
  }
  for(let i=0;i<14;i++){const g=x.createLinearGradient(0,0,0,s);g.addColorStop(0,'rgba(20,10,8,.0)');g.addColorStop(1,'rgba(20,10,8,.35)');x.fillStyle=g;x.fillRect(rng()*s,rng()*s*.5,1+rng()*3,s);}
});
const walkTex=canvasTex(128,(x,s)=>{
  x.fillStyle='#8c8079';x.fillRect(0,0,s,s);speckle(x,s,3000,.4);
  x.strokeStyle='rgba(30,18,14,.55)';x.lineWidth=1.5;
  for(let i=0;i<=4;i++){x.beginPath();x.moveTo(i*32,0);x.lineTo(i*32,s);x.stroke();x.beginPath();x.moveTo(0,i*32);x.lineTo(s,i*32);x.stroke();}
  x.strokeStyle='rgba(20,10,8,.6)';x.lineWidth=1;
  for(let i=0;i<5;i++){let px=rng()*s,py=rng()*s;x.beginPath();x.moveTo(px,py);for(let j=0;j<6;j++){px+=R(-12,12);py+=R(-12,12);x.lineTo(px,py);}x.stroke();}
});
const asphaltTex=canvasTex(256,(x,s)=>{
  x.fillStyle='#2e2826';x.fillRect(0,0,s,s);
  for(let i=0;i<9000;i++){const v=30+(rng()*45)|0;x.fillStyle=`rgb(${v},${v*.88|0},${v*.82|0})`;x.fillRect(rng()*s,rng()*s,1,1);}
  x.strokeStyle='rgba(8,5,4,.8)';x.lineWidth=1.2;
  for(let i=0;i<8;i++){let px=rng()*s,py=rng()*s;x.beginPath();x.moveTo(px,py);for(let j=0;j<10;j++){px+=R(-14,14);py+=R(-14,14);x.lineTo(px,py);}x.stroke();}
  for(let i=0;i<6;i++){x.fillStyle='rgba(10,6,5,.35)';x.beginPath();x.ellipse(rng()*s,rng()*s,R(6,22),R(4,14),rng()*3,0,7);x.fill();}
});
const dirtTex=canvasTex(256,(x,s)=>{
  x.fillStyle='#4a2c22';x.fillRect(0,0,s,s);
  for(let i=0;i<12000;i++){const v=40+(rng()*60)|0;x.fillStyle=`rgba(${v+20},${v*.6|0},${v*.45|0},.5)`;x.fillRect(rng()*s,rng()*s,1+rng()*2,1+rng()*2);}
});
function glowTex(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
const glow=glowTex();

/* ---------- geometry helpers ---------- */
function boxGeo(w,h,d,su,sv,solidTop){
  const g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv,dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let i=0;i<4;i++){const k=f*4+i;
    if(solidTop&&(f===2||f===3))uv.setXY(k,.03,.03);else uv.setXY(k,uv.getX(k)*dims[f][0]/su,uv.getY(k)*dims[f][1]/sv);}
  return g;
}
class Merger{
  constructor(){this.p=[];this.n=[];this.u=[];this.c=[];}
  add(g,m,col){const ng=g.index?g.toNonIndexed():g.clone();ng.applyMatrix4(m);
    const P=ng.attributes.position.array,Nn=ng.attributes.normal.array,U=ng.attributes.uv.array;
    for(let i=0;i<P.length;i++){this.p.push(P[i]);this.n.push(Nn[i]);}
    for(let i=0;i<U.length;i++)this.u.push(U[i]);
    for(let i=0;i<P.length/3;i++)this.c.push(col.r,col.g,col.b);}
  build(){const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(this.p,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(this.n,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(this.u,2));g.setAttribute('color',new THREE.Float32BufferAttribute(this.c,3));
    g.computeBoundingSphere();return g;}
}
const _q=new THREE.Quaternion(),_e=new THREE.Euler(),ONE=new THREE.Vector3(1,1,1);
function M(x,y,z,rx=0,ry=0,rz=0,s=ONE){_e.set(rx,ry,rz);_q.setFromEuler(_e);return new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),_q,s);}

/* ---------- city layout ---------- */
const N=4,CELL=48,ROAD=12,LOT=CELL-ROAD,BUILD=LOT-6,EXT=N*CELL;
const AVES=['Ash','Cinder','Harbor','Foundry','Vista','Meridian','Granite','Signal','Ember'];
const ord=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]||'th');
const GZ=new THREE.Vector3(2*CELL+10,0,-3*CELL-8);

const colliders=[],bld=new Merger(),lots=new Merger(),rubble=[],slabs=[];
const tints=[0xffffff,0xf2e6dc,0xe0d4ca,0xd8c8bb,0xc9bdb5,0xefdccb].map(C);
const rustDark=C(0x3a2620);

function addRubble(x,z,s,y){rubble.push({x,z,y:y!==undefined?y:s*.35,s});}
function building(x,z,w,d,h,collapsed){
  const tint=pick(tints).clone().multiplyScalar(R(.7,1));
  const base=collapsed?h:h*R(.55,.85);
  bld.add(boxGeo(w,base,d,4,4.5,true),M(x,base/2+.25,z),tint);
  colliders.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2});
  const top=base+.25;
  if(!collapsed){
    const n=2+(rng()*3|0);
    for(let i=0;i<n;i++){
      const cw=w*R(.25,.6),cd=d*R(.25,.6),ch=Math.max(1,(h-base)*R(.3,1.2));
      const ox=R(-1,1)*(w-cw)/2,oz=R(-1,1)*(d-cd)/2;
      bld.add(boxGeo(cw,ch,cd,4,4.5,true),M(x+ox,top+ch/2,z+oz),tint);
      for(let r=0;r<3;r++){const L=R(.8,3);bld.add(boxGeo(.09,L,.09,1,1,true),M(x+ox+R(-cw/2,cw/2),top+ch+L/2-.2,z+oz+R(-cd/2,cd/2),R(-.35,.35),0,R(-.35,.35)),rustDark);}
    }
    if(rng()<.35){const side=rng()<.5?1:-1,sw=w*R(.4,.8);
      bld.add(boxGeo(sw,.35,R(2,4),4,4,true),M(x+R(-1,1)*(w-sw)/4,R(4,base-1),z+side*(d/2+1.2),side*R(.05,.3),0,R(-.15,.15)),tint);}
    for(let i=0;i<10;i++){const a=rng()*6.283;addRubble(x+Math.cos(a)*(w/2+R(.3,2.5)),z+Math.sin(a)*(d/2+R(.3,2.5)),R(.2,.9));}
    if(rng()<.3)slabs.push({x:x+R(-w/2,w/2),z:z+(rng()<.5?1:-1)*(d/2+1.5),sx:R(3,6),sy:.4,sz:R(2,4),rx:R(-.5,.5),ry:rng()*3,rz:R(-.6,.6)});
  }else{
    for(let i=0;i<34;i++){const a=rng()*6.283,rr=Math.sqrt(rng());addRubble(x+Math.cos(a)*(w/2+3)*rr,z+Math.sin(a)*(d/2+3)*rr,R(.4,1.8),rr<.6?top+R(-.3,.4):undefined);}
    for(let i=0;i<3;i++)slabs.push({x:x+R(-w/2,w/2),z:z+R(-d/2,d/2),sx:R(3,7),sy:.45,sz:R(2,5),rx:R(-.6,.6),ry:rng()*3,rz:R(-.6,.6),y:top});
  }
}

for(let i=-N;i<N;i++)for(let j=-N;j<N;j++){
  const cx=(i+.5)*CELL,cz=(j+.5)*CELL;
  lots.add(boxGeo(LOT,.25,LOT,4,4,false),M(cx,.125,cz),C(0xffffff).multiplyScalar(R(.75,1)));
  const f=clamp(1-Math.hypot(cx,cz)/(EXT*1.5),.25,1);
  const hgt=()=>7+Math.pow(rng(),1.5)*50*f;
  const roll=rng();
  if(roll<.09){ for(let k=0;k<45;k++)addRubble(cx+R(-BUILD/2,BUILD/2),cz+R(-BUILD/2,BUILD/2),R(.2,1.1),R(.3,.6)); continue; }
  if(roll<.3){ const w=R(18,28),d=R(18,28);building(cx+R(-1,1)*(BUILD-w)/2,cz+R(-1,1)*(BUILD-d)/2,w,d,hgt()*1.15,rng()<.2?false:false);continue; }
  for(const qx of[-1,1])for(const qz of[-1,1]){
    if(rng()>.72)continue;
    const w=R(8,14),d=R(8,14),col=rng()<.27;
    building(cx+qx*(BUILD/2-w/2),cz+qz*(BUILD/2-d/2),w,d,col?R(2,6):hgt(),col);
  }
}
for(let i=0;i<380;i++){
  const along=R(-EXT,EXT),k=(rng()*(2*N+1)|0)-N,off=R(-ROAD/2,ROAD/2);
  if(rng()<.5)addRubble(k*CELL+off,along,R(.12,.6));else addRubble(along,k*CELL+off,R(.12,.6));
}
for(let i=0;i<260;i++){const a=rng()*6.283,r=R(EXT+10,EXT+90);addRubble(Math.cos(a)*r,Math.sin(a)*r,R(.3,1.5));}

const bldMat=new THREE.MeshStandardMaterial({map:winTex,vertexColors:true,roughness:.95,metalness:0});
const bldMesh=new THREE.Mesh(bld.build(),bldMat);bldMesh.castShadow=bldMesh.receiveShadow=true;scene.add(bldMesh);
const lotMesh=new THREE.Mesh(lots.build(),new THREE.MeshStandardMaterial({map:walkTex,vertexColors:true,roughness:1}));lotMesh.receiveShadow=true;scene.add(lotMesh);

/* ground + roads */
const roadW=2*EXT+ROAD;
const roadGeo=new THREE.PlaneGeometry(roadW,roadW);roadGeo.attributes.uv.array.forEach((v,i,a)=>a[i]=v*roadW/10);
const road=new THREE.Mesh(roadGeo,new THREE.MeshStandardMaterial({map:asphaltTex,roughness:.92,color:C(0xd8c8c0)}));
road.rotation.x=-Math.PI/2;road.receiveShadow=true;scene.add(road);
const dirtGeo=new THREE.PlaneGeometry(2000,2000);dirtGeo.attributes.uv.array.forEach((v,i,a)=>a[i]=v*120);
const dirt=new THREE.Mesh(dirtGeo,new THREE.MeshStandardMaterial({map:dirtTex,roughness:1}));
dirt.rotation.x=-Math.PI/2;dirt.position.y=-.03;dirt.receiveShadow=true;scene.add(dirt);

/* lane dashes */
const dashes=[];
for(let k=-N;k<=N;k++)for(let t=-EXT;t<EXT;t+=6){
  const local=((t%CELL)+CELL)%CELL;if(local<ROAD/2+1.5||local>CELL-ROAD/2-1.5)continue;
  if(rng()>.22)dashes.push([k*CELL,t,0]);if(rng()>.22)dashes.push([t,k*CELL,Math.PI/2]);
}
const dashGeo=new THREE.PlaneGeometry(.22,2.6);dashGeo.rotateX(-Math.PI/2);
const dashMesh=new THREE.InstancedMesh(dashGeo,new THREE.MeshStandardMaterial({color:C(0xa88a46),roughness:1,polygonOffset:true,polygonOffsetFactor:-2}),dashes.length);
dashes.forEach((d,i)=>dashMesh.setMatrixAt(i,M(d[0],.015,d[1],0,d[2],0)));dashMesh.receiveShadow=true;scene.add(dashMesh);

/* rubble + slabs */
const rubMesh=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1,0),new THREE.MeshStandardMaterial({roughness:1,flatShading:true}),rubble.length);
const rubCols=[0x8f827a,0x7a6c64,0x9c8a7c,0x5e4f48,0x6e5e52,0x4a3a33].map(C);
rubble.forEach((r,i)=>{rubMesh.setMatrixAt(i,M(r.x,r.y,r.z,rng()*6,rng()*6,rng()*6,new THREE.Vector3(r.s*R(.8,1.4),r.s*R(.4,.9),r.s*R(.8,1.4))));rubMesh.setColorAt(i,pick(rubCols));});
rubMesh.castShadow=rubMesh.receiveShadow=true;scene.add(rubMesh);
const slabMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({map:walkTex,roughness:1,color:C(0xcfc2b8)}),slabs.length);
slabs.forEach((s,i)=>slabMesh.setMatrixAt(i,M(s.x,(s.y||0)+Math.max(.6,Math.sin(Math.abs(s.rx)+Math.abs(s.rz))*s.sx*.4),s.z,s.rx,s.ry,s.rz,new THREE.Vector3(s.sx,s.sy,s.sz))));
slabMesh.castShadow=slabMesh.receiveShadow=true;scene.add(slabMesh);

/* distant skyline silhouettes (beyond the fog wall) */
const far=new Merger();
for(let i=0;i<110;i++){const a=rng()*6.283,r=R(300,480),w=R(10,34),h=R(18,110)*(rng()<.2?.35:1);
  far.add(new THREE.BoxGeometry(w,h,w*R(.6,1.2)),M(Math.cos(a)*r,h/2-1,Math.sin(a)*r,0,rng()*3,rng()<.15?R(-.2,.2):0),C(0xffffff));}
const farMesh=new THREE.Mesh(far.build(),new THREE.MeshBasicMaterial({color:FOG.clone().multiplyScalar(.42),fog:false}));scene.add(farMesh);

/* ground-zero beam: a fixed landmark to orient by */
const beam=new THREE.Mesh(new THREE.CylinderGeometry(1.2,3.5,420,16,1,true),new THREE.MeshBasicMaterial({color:C(0xff6a40),transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,side:THREE.DoubleSide}));
beam.position.set(GZ.x,210,GZ.z);scene.add(beam);

/* ---------- traffic lights ---------- */
const tl=new Merger(),metal=C(0x2e2724);
tl.add(new THREE.CylinderGeometry(.11,.15,5.4,8),M(0,2.7,0),metal);
tl.add(new THREE.BoxGeometry(3.4,.14,.14),M(1.7,5.2,0),metal);
tl.add(new THREE.BoxGeometry(.06,1.8,.06),M(.8,4.5,0,0,0,.95),metal);
tl.add(new THREE.BoxGeometry(.5,1.55,.46),M(3.2,4.45,0),C(0x1c1816));
tl.add(new THREE.BoxGeometry(.7,1.75,.05),M(3.2,4.45,0),C(0x14100e));
const poles=[],lamps=[];
for(let k=-N;k<=N;k++)for(let l=-N;l<=N;l++){
  if(rng()<.1)continue;
  const sx=rng()<.5?-1:1,sz=rng()<.5?-1:1,px=k*CELL+sx*(ROAD/2+1.3),pz=l*CELL+sz*(ROAD/2+1.3);
  const fallen=rng()<.15,ry=sx>0?Math.PI:0;
  const m=fallen?M(px,.15,pz,0,ry+R(-.4,.4),(rng()<.5?1:-1)*1.45):M(px,.25,pz,R(-.04,.04),ry,R(-.05,.05));
  poles.push(m);
  if(!fallen)colliders.push({x0:px-.25,x1:px+.25,z0:pz-.25,z1:pz+.25});
  const r=rng(),mode=fallen?'dead':r<.5?'red':r<.72?'amber':r<.88?'dead':'flicker',ph=rng()*6;
  for(let s=0;s<3;s++)for(const zf of[-1,1])lamps.push({m:m.clone().multiply(new THREE.Matrix4().makeTranslation(3.2,4.45+.48-s*.48,zf*.25)),slot:s,mode,ph});
}
const tlMesh=new THREE.InstancedMesh(tl.build(),new THREE.MeshStandardMaterial({vertexColors:true,roughness:.6,metalness:.5}),poles.length);
poles.forEach((m,i)=>tlMesh.setMatrixAt(i,m));tlMesh.castShadow=true;scene.add(tlMesh);
const lampMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(.17,10,8),new THREE.MeshBasicMaterial({color:0xffffff}),lamps.length);
const glowPos=new Float32Array(lamps.length*3),glowCol=new Float32Array(lamps.length*3),_v=new THREE.Vector3();
lamps.forEach((L,i)=>{lampMesh.setMatrixAt(i,L.m);_v.setFromMatrixPosition(L.m);glowPos.set([_v.x,_v.y,_v.z],i*3);});
scene.add(lampMesh);
const glowGeo=new THREE.BufferGeometry();glowGeo.setAttribute('position',new THREE.BufferAttribute(glowPos,3));glowGeo.setAttribute('color',new THREE.BufferAttribute(glowCol,3));
const glowPts=new THREE.Points(glowGeo,new THREE.PointsMaterial({size:2.2,map:glow,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
scene.add(glowPts);
const LIT=[C(0xff2a12).multiplyScalar(3),C(0xffa020).multiplyScalar(3),C(0x40ff90).multiplyScalar(2.2)],OFF=C(0x231a17),BLACK=new THREE.Color(0,0,0),_c=new THREE.Color();
function updateLamps(t){
  lamps.forEach((L,i)=>{
    let on=0;
    if(L.mode==='red'&&L.slot===0)on=1;
    else if(L.mode==='amber'&&L.slot===1)on=Math.sin(t*3.6+L.ph)>0?1:0;
    else if(L.mode==='flicker'&&L.slot===0)on=Math.sin(t*23+L.ph)*Math.sin(t*7.3+L.ph*2)>-.2?(.4+.6*Math.random()):0;
    _c.copy(OFF).lerp(LIT[L.slot],on);lampMesh.setColorAt(i,_c);
    _c.copy(BLACK).lerp(LIT[L.slot],on*.28);glowCol.set([_c.r,_c.g,_c.b],i*3);
  });
  lampMesh.instanceColor.needsUpdate=true;glowGeo.attributes.color.needsUpdate=true;
}

/* ---------- drifting ash ---------- */
const ASH=coarse?900:1600,ashBox=70,ashH=28;
const ashPos=new Float32Array(ASH*3),ashSeed=new Float32Array(ASH);
for(let i=0;i<ASH;i++){ashPos[i*3]=R(-ashBox,ashBox);ashPos[i*3+1]=R(0,ashH);ashPos[i*3+2]=R(-ashBox,ashBox);ashSeed[i]=rng()*6.28;}
const ashGeo=new THREE.BufferGeometry();ashGeo.setAttribute('position',new THREE.BufferAttribute(ashPos,3));
const ash=new THREE.Points(ashGeo,new THREE.PointsMaterial({size:.13,map:glow,color:C(0xffb08a),transparent:true,opacity:.7,depthWrite:false,blending:THREE.AdditiveBlending}));
ash.frustumCulled=false;scene.add(ash);

/* ---------- player + controls ---------- */
const player=new THREE.Vector3(0,0,30);
let yaw=0,pitch=.04,groundY=0,glide=0,bob=0;
const vel=new THREE.Vector3(),keys={},joy={x:0,y:0,bx:0,by:0};
const PR=.45;
function collide(p){
  for(const b of colliders){
    if(p.x>b.x0-PR&&p.x<b.x1+PR&&p.z>b.z0-PR&&p.z<b.z1+PR){
      const l=p.x-(b.x0-PR),r=(b.x1+PR)-p.x,u=p.z-(b.z0-PR),d=(b.z1+PR)-p.z,m=Math.min(l,r,u,d);
      if(m===l)p.x=b.x0-PR;else if(m===r)p.x=b.x1+PR;else if(m===u)p.z=b.z0-PR;else p.z=b.z1+PR;
    }
  }
  p.x=clamp(p.x,-EXT-70,EXT+70);p.z=clamp(p.z,-EXT-70,EXT+70);
}
function onLot(x,z){const lx=((x%CELL)+CELL)%CELL,lz=((z%CELL)+CELL)%CELL;
  return Math.abs(x)<EXT&&Math.abs(z)<EXT&&lx>ROAD/2&&lx<CELL-ROAD/2&&lz>ROAD/2&&lz<CELL-ROAD/2;}

addEventListener('keydown',e=>{keys[e.code]=true;if(/^(Arrow|Space)/.test(e.code))e.preventDefault();dismissHint();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

const cv=renderer.domElement,ptrs=new Map(),joyEl=$('joy'),knob=$('knob');
let joyId=null,lookId=null;
cv.addEventListener('pointerdown',e=>{
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  dismissHint();
  if(e.pointerType==='touch'&&joyId===null&&e.clientX<innerWidth*.45){
    joyId=e.pointerId;joy.bx=e.clientX;joy.by=e.clientY;joyEl.style.left=e.clientX+'px';joyEl.style.top=e.clientY+'px';knob.style.transform='';joyEl.hidden=false;
  }else if(lookId===null)lookId=e.pointerId;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(e.pointerId===joyId){let jx=e.clientX-joy.bx,jy=e.clientY-joy.by;const L=Math.hypot(jx,jy),mx=52;if(L>mx){jx*=mx/L;jy*=mx/L;}
    joy.x=jx/mx;joy.y=-jy/mx;knob.style.transform=`translate(${jx}px,${jy}px)`;}
  else if(e.pointerId===lookId){const k=e.pointerType==='touch'?.0058:.0035;yaw-=dx*k;pitch=clamp(pitch-dy*k,-1.35,1.35);}
});
const endPtr=e=>{if(e.pointerId===joyId){joyId=null;joy.x=joy.y=0;joyEl.hidden=true;}if(e.pointerId===lookId)lookId=null;ptrs.delete(e.pointerId);};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();dismissHint();glide=clamp(glide-e.deltaY*.03,-30,30);},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function step(dt){
  let f=0,s=0;
  if(keys.KeyW)f+=1;if(keys.KeyS)f-=1;if(keys.KeyD)s+=1;if(keys.KeyA)s-=1;
  if(keys.ArrowUp)f+=1;if(keys.ArrowDown)f-=1;
  if(keys.ArrowLeft)yaw+=1.9*dt;if(keys.ArrowRight)yaw-=1.9*dt;
  f+=joy.y;s+=joy.x;
  const L=Math.hypot(f,s);if(L>1){f/=L;s/=L;}
  const run=keys.ShiftLeft||keys.ShiftRight||Math.hypot(joy.x,joy.y)>.96;
  const sp=run?15:7.5;
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const tx=(fx*f+rx*s)*sp+fx*glide,tz=(fz*f+rz*s)*sp+fz*glide;
  const a=1-Math.exp(-9*dt);vel.x+=(tx-vel.x)*a;vel.z+=(tz-vel.z)*a;
  glide*=Math.exp(-2.5*dt);if(Math.abs(glide)<.05)glide=0;
  player.x+=vel.x*dt;player.z+=vel.z*dt;collide(player);
  groundY+=((onLot(player.x,player.z)?.25:0)-groundY)*(1-Math.exp(-14*dt));
  const spd=Math.hypot(vel.x,vel.z);bob+=spd*dt*1.15;
  const b=reduceMotion?0:Math.sin(bob*2)*.05*Math.min(spd/7,1.4);
  camera.position.set(player.x,groundY+1.7+b,player.z);
  camera.rotation.set(pitch,yaw,0);
}

/* ---------- HUD ---------- */
const strip=$('strip'),PX=2;let compassW=200;
(function(){let h='';const names={0:'N',45:'NE',90:'E',135:'SE',180:'S',225:'SW',270:'W',315:'NW'};
  for(let d=-360;d<=720;d+=15){const nd=((d%360)+360)%360,lb=names[nd];
    h+=lb?`<span class="${lb.length===1?'card'+(lb==='N'?' n':''):'ord'}" style="left:${(d+360)*PX}px">${lb}</span>`:`<span class="tick" style="left:${(d+360)*PX}px"></span>`;}
  strip.innerHTML=h;})();
const DIRS=['N','NE','E','SE','S','SW','W','NW'];
const aveName=k=>AVES[clamp(k+N,0,8)]+' Ave',stName=l=>ord(l+N+1)+' St';
let hudT=0,lastStreet='',doseT=0;
function hud(dt){
  const heading=((-yaw*180/Math.PI)%360+360)%360;
  strip.style.transform=`translateX(${compassW/2-(heading+360)*PX}px)`;
  hudT+=dt;if(hudT<.12)return;hudT=0;
  $('deg').textContent=String(Math.round(heading)%360).padStart(3,'0')+'° '+DIRS[Math.round(heading/45)%8];
  const k=Math.round(player.x/CELL),l=Math.round(player.z/CELL),dx=Math.abs(player.x-k*CELL),dz=Math.abs(player.z-l*CELL);
  const kx=Math.floor(player.x/CELL),lz=Math.floor(player.z/CELL);
  let st,sub;
  if(Math.abs(player.x)>EXT+6||Math.abs(player.z)>EXT+6){st='Outer wastes';sub='city edge · head back toward the streets';}
  else if(dx<ROAD/2+1&&dz<ROAD/2+1){st=`${aveName(k)} & ${stName(l)}`;sub='intersection';}
  else if(dx<ROAD/2+1){st=aveName(k);sub=`between ${stName(lz)} & ${stName(lz+1)}`;}
  else if(dz<ROAD/2+1){st=stName(l);sub=`between ${AVES[clamp(kx+N,0,8)]} & ${aveName(kx+1)}`;}
  else{st='Ruins';sub=`block off ${aveName(k)} & ${stName(l)}`;}
  const key=st+sub;if(key!==lastStreet){$('street').textContent=st;$('sub').textContent=sub;lastStreet=key;}
  doseT+=.12;if(doseT>=.36){doseT=0;
    const d=Math.hypot(player.x-GZ.x,player.z-GZ.z),v=0.9+60/(1+Math.pow(d/45,2))+Math.random()*.6;
    const el=$('dose');el.textContent=v.toFixed(2);el.classList.toggle('hot',v>10);}
}
const hint=$('hint');
hint.textContent=coarse?'Left thumb walks · right thumb looks · push the stick all the way to run':'Drag to look · WASD to walk · Shift to run · scroll to glide';
let hintGone=false;function dismissHint(){if(hintGone)return;hintGone=true;setTimeout(()=>hint.classList.add('gone'),2500);}
setTimeout(dismissHint,6000);

/* ---------- loop ---------- */
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();compassW=strip.parentElement.clientWidth;}
addEventListener('resize',resize);resize();

let last=performance.now(),t=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  step(dt);
  sky.position.copy(camera.position);
  sun.position.copy(player).addScaledVector(sunDir,180);sun.target.position.copy(player);
  for(let i=0;i<ASH;i++){const o=i*3;
    ashPos[o]+=(Math.sin(t*.4+ashSeed[i])*.25+.35)*dt;ashPos[o+1]-=(.25+ashSeed[i]*.03)*dt;ashPos[o+2]+=Math.cos(t*.3+ashSeed[i])*.2*dt;
    if(ashPos[o+1]<0)ashPos[o+1]+=ashH;}
  ashGeo.attributes.position.needsUpdate=true;
  for(let i=0;i<ASH;i++){const o=i*3;
    if(ashPos[o]-player.x>ashBox)ashPos[o]-=ashBox*2;else if(ashPos[o]-player.x<-ashBox)ashPos[o]+=ashBox*2;
    if(ashPos[o+2]-player.z>ashBox)ashPos[o+2]-=ashBox*2;else if(ashPos[o+2]-player.z<-ashBox)ashPos[o+2]+=ashBox*2;}
  updateLamps(t);
  beam.material.opacity=.13+.04*Math.sin(t*1.7);
  hud(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

</body>
</html>
