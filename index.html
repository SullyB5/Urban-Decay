<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Vista 3D Urban Decay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Full-bleed WebGL city; scavenger HUD pinned to the corners. Single dark look by design. */
:root{
  --ink:#f3ece2; --dim:rgba(243,236,226,.66); --glass:rgba(16,14,12,.42); --line:rgba(243,214,160,.32); --accent:#f2b84b; --good:#9fe07a;
  --display:'Chakra Petch','Arial Narrow',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:#16130f;color:var(--ink)}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:var(--mono)}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;cursor:crosshair}
.hud{position:fixed;pointer-events:none;z-index:2;text-shadow:0 1px 5px rgba(0,0,0,.7)}
.brand{top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 16px);display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.18em}
.brand span{font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.compass{top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);width:min(240px,40vw);height:34px;overflow:hidden;
  background:var(--glass);border:1px solid var(--line);border-radius:3px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);text-shadow:none}
.strip{position:absolute;top:0;left:0;height:100%;will-change:transform}
.strip span{position:absolute;top:0;transform:translateX(-50%)}
.strip .tick{top:4px;width:1px;height:6px;background:var(--dim)}
.strip .card{top:12px;font-family:var(--display);font-weight:700;font-size:14px}
.strip .card.n{color:var(--accent)}
.strip .ord{top:14px;font-size:10px;color:var(--dim)}
.needle{position:absolute;left:50%;top:0;width:2px;height:7px;margin-left:-1px;background:var(--accent)}
.clock{top:calc(env(safe-area-inset-top,0px) + 50px);left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.1em;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.readout{left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);max-width:62vw;display:flex;flex-direction:column;gap:2px}
.district{font-size:10px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.street{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.03em;text-wrap:balance}
.sub{font-size:11px;color:var(--dim)}
.loot{top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 16px);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.loot .lbl{font-size:10px;letter-spacing:.16em;color:var(--dim)}
.loot .val{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.loot .val b{color:var(--good)}
.toast{left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);padding:6px 12px;background:var(--glass);border:1px solid var(--line);border-radius:3px;
  font:700 12px var(--display);letter-spacing:.12em;text-transform:uppercase;opacity:0;transition:opacity .35s;white-space:nowrap}
.toast.on{opacity:1}
.hint{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);
  padding:8px 12px;background:var(--glass);border:1px solid var(--line);border-radius:3px;font-size:11px;letter-spacing:.04em;text-align:center;transition:opacity .8s}
.hint.gone{opacity:0}
.reticle{left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(243,236,226,.55)}
.ctrls{position:fixed;z-index:3;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.ctrls button{min-width:56px;height:56px;padding:0 12px;border-radius:28px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:700 12px var(--display);letter-spacing:.1em;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none;cursor:pointer}
.ctrls button.on{background:rgba(242,184,75,.35);border-color:var(--accent)}
.ctrls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.joy{position:fixed;z-index:3;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:1px solid var(--line);background:rgba(16,14,12,.25);pointer-events:none}
.joy .knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(242,184,75,.32);border:1px solid rgba(255,220,160,.6)}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:13px}
@media (max-width:420px){.brand span{display:none}.street{font-size:15px}.loot .val{font-size:17px}}
@media (prefers-reduced-motion:reduce){.hint,.toast{transition:none}}
</style>
</head>
<body>


<div id="app"></div>
<div class="hud brand"><b>VISTA 3D</b><span>urban decay · open city</span></div>
<div class="hud compass"><div class="strip" id="strip"></div><i class="needle"></i></div>
<div class="hud clock" id="clock">08:00 · morning</div>
<div class="hud loot"><span class="lbl">SUPPLIES FOUND</span><span class="val" id="lootv"><b>0</b> / 0</span></div>
<div class="hud toast" id="toast"></div>
<div class="hud readout"><div class="district" id="district">Downtown</div><div class="street" id="street">Ash Ave</div><div class="sub" id="sub">&nbsp;</div></div>
<div class="hud hint" id="hint"></div>
<div class="hud reticle"></div>
<div class="ctrls">
  <button id="up" type="button" hidden>UP</button>
  <button id="down" type="button" hidden>DOWN</button>
  <button id="fly" type="button">FLY</button>
</div>
<div class="joy" id="joy" hidden><div class="knob" id="knob"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div class="err">The 3D engine failed to load. Reload the page to try again.</div>');return;}
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}
catch(e){document.body.insertAdjacentHTML('beforeend','<div class="err">This browser could not start WebGL, which the city needs to render.</div>');return;}

/* ---------- helpers ---------- */
let seed=4471;
const rng=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=(a,b)=>a+rng()*(b-a),pick=a=>a[(rng()*a.length)|0],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const C=h=>new THREE.Color(h).convertSRGBToLinear();
const coarse=matchMedia('(pointer:coarse)').matches;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function hash(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}

/* ---------- renderer / scene ---------- */
renderer.setPixelRatio(Math.min(devicePixelRatio||1,coarse?1.5:2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const fogCol=new THREE.Color();
scene.fog=new THREE.FogExp2(fogCol,0.0022);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,3000);
camera.rotation.order='YXZ';

/* ---------- sky with a moving sun, stars at night ---------- */
const skyU={top:{value:new THREE.Color()},hor:{value:new THREE.Color()},sunDir:{value:new THREE.Vector3(0,1,0)},sunCol:{value:new THREE.Color()},glowAmt:{value:1}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(2400,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:skyU,
  vertexShader:'varying vec3 vDir;void main(){vDir=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:`varying vec3 vDir;uniform vec3 top,hor,sunDir,sunCol;uniform float glowAmt;
  void main(){vec3 d=normalize(vDir);float y=max(d.y,0.0);
    vec3 c=mix(hor,top,pow(smoothstep(0.0,1.0,y),0.6));
    float s=max(dot(d,sunDir),0.0);
    c+=sunCol*(pow(s,8.0)*0.35*glowAmt+pow(s,90.0)*0.8*glowAmt)+sunCol*3.0*smoothstep(0.9994,0.9997,s)*step(-0.05,sunDir.y);
    if(d.y<0.0)c=hor;
    gl_FragColor=vec4(c,1.0);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }`}));
sky.renderOrder=-1;scene.add(sky);
const starGeo=new THREE.BufferGeometry(),starPos=[];
for(let i=0;i<1600;i++){const u=rng()*2-1,a=rng()*6.283,r=Math.sqrt(1-u*u);if(u<.05)continue;starPos.push(Math.cos(a)*r*2200,u*2200,Math.sin(a)*r*2200);}
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({size:2.2,sizeAttenuation:false,color:0xffffff,transparent:true,opacity:0,depthWrite:false,fog:false}));
scene.add(stars);
const moon=new THREE.Mesh(new THREE.SphereGeometry(38,20,14),new THREE.MeshBasicMaterial({color:C(0xe9edf5),fog:false,transparent:true}));
scene.add(moon);

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0xffffff,0x3a332a,.5);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2);sun.castShadow=true;
sun.shadow.mapSize.set(coarse?1024:2048,coarse?1024:2048);
Object.assign(sun.shadow.camera,{left:-110,right:110,top:110,bottom:-110,near:1,far:900});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.04;
scene.add(sun,sun.target);
const moonLight=new THREE.DirectionalLight(C(0x9fb4ff),0);scene.add(moonLight,moonLight.target);

/* ---------- textures ---------- */
function canvasTex(w,h,draw,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;}
function grime(x,w,h,n,a){for(let i=0;i<n;i++){const v=(rng()*70)|0;x.fillStyle=`rgba(${v},${v*.9|0},${v*.8|0},${a*rng()})`;x.fillRect(rng()*w,rng()*h,1+rng()*3,1+rng()*3);}
  for(let i=0;i<10;i++){const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(30,22,16,0)');g.addColorStop(1,'rgba(30,22,16,.35)');x.fillStyle=g;x.fillRect(rng()*w,rng()*h*.4,1+rng()*4,h);}}
// facade sheets: 4 window bays x 4 floors per tile; matching "lit window" emissive sheets for the night
function facade(base,frame,winFn,litChance,brick){
  const lit=[];const tex=canvasTex(128,128,(x,w,h)=>{
    x.fillStyle=base;x.fillRect(0,0,w,h);
    if(brick){x.strokeStyle='rgba(40,20,14,.35)';x.lineWidth=1;for(let y=0;y<h;y+=4){x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke();for(let xx=(y/4%2)*4;xx<w;xx+=8){x.beginPath();x.moveTo(xx,y);x.lineTo(xx,y+4);x.stroke();}}}
    grime(x,w,h,1600,.3);
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){const X=6+c*32,Y=6+r*32,k=rng();
      x.fillStyle=frame;x.fillRect(X-2,Y-2,24,24);
      x.fillStyle=winFn(k);x.fillRect(X,Y,20,20);
      if(k>.8){x.fillStyle=base;x.beginPath();x.moveTo(X,Y+20);x.lineTo(X+5+rng()*10,Y+10+rng()*8);x.lineTo(X+20,Y+20);x.fill();}
      if(rng()<litChance)lit.push([X,Y]);}
  });
  const em=canvasTex(128,128,(x,w,h)=>{x.fillStyle='#000';x.fillRect(0,0,w,h);for(const [X,Y] of lit){const g=x.createRadialGradient(X+10,Y+12,1,X+10,Y+10,16);g.addColorStop(0,'#ffb35a');g.addColorStop(1,'#401800');x.fillStyle=g;x.fillRect(X,Y,20,20);}});
  return{tex,em};
}
const FAC={
  office:facade('#9aa0a3','#3c4246',k=>k<.55?'#1c2226':k<.8?'#2c3a44':'#0b0c0d',.12),
  brick:facade('#8a4b38','#d8cbb5',k=>k<.6?'#1d1a18':'#0c0b0a',.16,true),
  plaster:facade('#c8b79a','#8c7a62',k=>k<.6?'#211d18':'#0c0b0a',.14),
  glass:facade('#5d7584','#2a3238',k=>k<.5?'#253844':k<.85?'#3b5566':'#0b0e10',.08),
};
const corrTex=canvasTex(64,64,(x,w,h)=>{for(let i=0;i<w;i+=4){x.fillStyle=i%8?'#7d8085':'#5f6266';x.fillRect(i,0,4,h);}grime(x,w,h,500,.4);});
const concreteTex=canvasTex(128,128,(x,w,h)=>{x.fillStyle='#8f8a82';x.fillRect(0,0,w,h);grime(x,w,h,2500,.35);
  x.strokeStyle='rgba(40,34,28,.45)';for(let i=0;i<5;i++){let px=rng()*w,py=rng()*h;x.beginPath();x.moveTo(px,py);for(let j=0;j<7;j++){px+=R(-14,14);py+=R(-14,14);x.lineTo(px,py);}x.stroke();}});
const walkTex=canvasTex(128,128,(x,w,h)=>{x.fillStyle='#8d8780';x.fillRect(0,0,w,h);grime(x,w,h,2200,.35);x.strokeStyle='rgba(40,32,26,.45)';
  for(let i=0;i<=4;i++){x.beginPath();x.moveTo(i*32,0);x.lineTo(i*32,h);x.stroke();x.beginPath();x.moveTo(0,i*32);x.lineTo(w,i*32);x.stroke();}});
const asphaltTex=canvasTex(256,256,(x,w,h)=>{x.fillStyle='#2f2d2b';x.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){const v=30+(rng()*40)|0;x.fillStyle=`rgb(${v},${v-2},${v-4})`;x.fillRect(rng()*w,rng()*h,1,1);}
  x.strokeStyle='rgba(8,6,5,.8)';for(let i=0;i<9;i++){let px=rng()*w,py=rng()*h;x.beginPath();x.moveTo(px,py);for(let j=0;j<10;j++){px+=R(-14,14);py+=R(-14,14);x.lineTo(px,py);}x.stroke();}
  for(let i=0;i<5;i++){x.fillStyle='rgba(60,70,40,.35)';x.beginPath();x.ellipse(rng()*w,rng()*h,R(6,20),R(3,10),rng()*3,0,7);x.fill();}});
const grassTex=canvasTex(128,128,(x,w,h)=>{x.fillStyle='#5b5a37';x.fillRect(0,0,w,h);for(let i=0;i<5000;i++){const g=60+(rng()*60)|0;x.fillStyle=`rgba(${g+20},${g+10},${g*.45|0},.6)`;x.fillRect(rng()*w,rng()*h,1,2);}});
const dirtTex=canvasTex(256,256,(x,w,h)=>{x.fillStyle='#5d5243';x.fillRect(0,0,w,h);for(let i=0;i<12000;i++){const v=50+(rng()*60)|0;x.fillStyle=`rgba(${v+20},${v+8},${v*.7|0},.5)`;x.fillRect(rng()*w,rng()*h,1+rng()*2,1+rng()*2);}});
// store signs: an atlas of 32 painted signs, some with letters knocked out
const SIGNS=['PHARMACY','DINER','HARDWARE','LAUNDRY','PAWN SHOP','GROCERY','MOTEL','LIQUOR','BAKERY','CINEMA','BARBER','BOOKS','DONUTS','PIZZA','BANK','TAVERN',
  'GARAGE','FLORIST','ARCADE','CAFE','DELI','TOYS','RADIO SHACK','NEWS','MARKET','HOTEL','GYM','FUEL','AUTO PARTS','NOODLES','TACOS','OPEN 24 HRS'];
const SCH=[['#b9271f','#f6e7c8'],['#1f4e8c','#f2f2f2'],['#f2c230','#1b1b1b'],['#2e7d4f','#f4efe0'],['#f4efe0','#1b3a6b'],['#1b1b1b','#ffd34d'],['#7a2e8c','#ffe8f6'],['#d9662b','#fff4e0']];
const signAtlas=canvasTex(1024,512,(x)=>{
  for(let i=0;i<32;i++){const cx=(i%4)*256,cy=((i/4)|0)*64,[bg,fg]=pick(SCH);
    x.fillStyle=bg;x.fillRect(cx,cy,256,64);x.strokeStyle=fg;x.lineWidth=3;x.strokeRect(cx+4,cy+4,248,56);
    let txt=SIGNS[i];if(rng()<.35){const k=(rng()*txt.length)|0;if(txt[k]!==' ')txt=txt.slice(0,k)+' '+txt.slice(k+1);}
    x.fillStyle=fg;let fs=40;x.font=`900 ${fs}px Impact, 'Arial Black', Arial, sans-serif`;while(x.measureText(txt).width>228&&fs>14){fs-=2;x.font=`900 ${fs}px Impact, 'Arial Black', Arial, sans-serif`;}
    x.textAlign='center';x.textBaseline='middle';x.fillText(txt,cx+128,cy+34);
    for(let k=0;k<160;k++){x.fillStyle=`rgba(20,14,10,${rng()*.45})`;x.fillRect(cx+rng()*256,cy+rng()*64,1+rng()*3,1+rng()*3);}
    if(rng()<.4){x.fillStyle='rgba(15,10,8,.55)';x.beginPath();x.ellipse(cx+R(20,236),cy+R(10,54),R(10,30),R(6,18),rng()*3,0,7);x.fill();}
  }});

/* ---------- geometry helpers: merged, chunked static meshes ---------- */
function boxUV(w,h,d,su,sv,solidTop){
  const g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv,dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let i=0;i<4;i++){const k=f*4+i;
    if(solidTop&&(f===2||f===3))uv.setXY(k,.02,.02);else uv.setXY(k,uv.getX(k)*dims[f][0]/su,uv.getY(k)*dims[f][1]/sv);}
  return g;
}
class Merger{
  constructor(){this.p=[];this.n=[];this.u=[];this.c=[];}
  add(g,m,col){const ng=g.index?g.toNonIndexed():g.clone();ng.applyMatrix4(m);
    const P=ng.attributes.position.array,Nn=ng.attributes.normal.array,U=ng.attributes.uv.array;
    for(let i=0;i<P.length;i++){this.p.push(P[i]);this.n.push(Nn[i]);}for(let i=0;i<U.length;i++)this.u.push(U[i]);
    for(let i=0;i<P.length/3;i++)this.c.push(col.r,col.g,col.b);}
  build(){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(this.p,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(this.n,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(this.u,2));g.setAttribute('color',new THREE.Float32BufferAttribute(this.c,3));g.computeBoundingSphere();return g;}
}
const _q=new THREE.Quaternion(),_e=new THREE.Euler(),_v=new THREE.Vector3(),ONE=new THREE.Vector3(1,1,1);
function M(x,y,z,rx=0,ry=0,rz=0,s=ONE){_e.set(rx,ry,rz);_q.setFromEuler(_e);return new THREE.Matrix4().compose(_v.set(x,y,z),_q,s);}
const N=13,CELL=48,ROAD=12,LOT=CELL-ROAD,BUILD=LOT-6,EXT=N*CELL,CH=4,CHSZ=2*EXT/CH;
const MATS={
  office:new THREE.MeshStandardMaterial({map:FAC.office.tex,emissiveMap:FAC.office.em,emissive:0xffffff,emissiveIntensity:0,vertexColors:true,roughness:.85}),
  brick:new THREE.MeshStandardMaterial({map:FAC.brick.tex,emissiveMap:FAC.brick.em,emissive:0xffffff,emissiveIntensity:0,vertexColors:true,roughness:.92}),
  plaster:new THREE.MeshStandardMaterial({map:FAC.plaster.tex,emissiveMap:FAC.plaster.em,emissive:0xffffff,emissiveIntensity:0,vertexColors:true,roughness:.9}),
  glass:new THREE.MeshStandardMaterial({map:FAC.glass.tex,emissiveMap:FAC.glass.em,emissive:0xffffff,emissiveIntensity:0,vertexColors:true,roughness:.35,metalness:.3}),
  corr:new THREE.MeshStandardMaterial({map:corrTex,vertexColors:true,roughness:.7,metalness:.3}),
  concrete:new THREE.MeshStandardMaterial({map:concreteTex,vertexColors:true,roughness:.95}),

addEventListener('keydown',e=>{keys[e.code]=true;if(/^(Arrow|Space)/.test(e.code))e.preventDefault();if(e.code==='KeyG')setFly(!flying);dismissHint();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;vert=0;});
const cv=renderer.domElement,ptrs=new Map(),joyEl=$('joy'),knob=$('knob');
let joyId=null,lookId=null,locked=false;
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  dismissHint();
  if(joyId===null&&e.clientX<innerWidth*.45){joyId=e.pointerId;joy.bx=e.clientX;joy.by=e.clientY;joyEl.style.left=e.clientX+'px';joyEl.style.top=e.clientY+'px';knob.style.transform='';joyEl.hidden=false;}
  else if(lookId===null)lookId=e.pointerId;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(e.pointerId===joyId){let jx=e.clientX-joy.bx,jy=e.clientY-joy.by;const L=Math.hypot(jx,jy),mx=52;if(L>mx){jx*=mx/L;jy*=mx/L;}joy.x=jx/mx;joy.y=-jy/mx;knob.style.transform=`translate(${jx}px,${jy}px)`;}
  else if(e.pointerId===lookId){yaw-=dx*.0058;pitch=clamp(pitch-dy*.0058,-1.4,1.4);}
});
const endPtr=e=>{if(e.pointerId===joyId){joyId=null;joy.x=joy.y=0;joyEl.hidden=true;}if(e.pointerId===lookId)lookId=null;ptrs.delete(e.pointerId);};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('click',e=>{dismissHint();if(coarse||locked||!cv.requestPointerLock)return;try{const p=cv.requestPointerLock();if(p&&p.catch)p.catch(()=>{});}catch(_){}});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;cv.style.cursor=locked?'none':'';});
cv.addEventListener('mousemove',e=>{const k=locked?.0022:.003;yaw-=(e.movementX||0)*k;pitch=clamp(pitch-(e.movementY||0)*k,-1.4,1.4);});
cv.addEventListener('wheel',e=>{e.preventDefault();glide=clamp(glide-e.deltaY*.03,-40,40);},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function holdBtn(el,dir){const on=e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}vert=dir;el.classList.add('on');};const off=()=>{if(vert===dir)vert=0;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);el.addEventListener('contextmenu',e=>e.preventDefault());}
holdBtn($('up'),1);holdBtn($('down'),-1);
function setFly(on){flying=on;$('fly').classList.toggle('on',on);$('fly').textContent=on?'LAND':'FLY';$('up').hidden=$('down').hidden=!on||!coarse;toast(on?'Flying · Space up, Q down':'Back on foot');if(!on)vel.y=0;}
$('fly').addEventListener('click',()=>{setFly(!flying);$('fly').blur();});
function step(dt){
  let f=0,s=0,u=vert;
  if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyD)s+=1;if(keys.KeyA)s-=1;
  if(keys.ArrowLeft)yaw+=1.9*dt;if(keys.ArrowRight)yaw-=1.9*dt;
  if(keys.Space||keys.KeyE)u+=1;if(keys.KeyQ||keys.KeyC)u-=1;
  f+=joy.y;s+=joy.x;const L=Math.hypot(f,s);if(L>1){f/=L;s/=L;}
  const run=keys.ShiftLeft||keys.ShiftRight||Math.hypot(joy.x,joy.y)>.96;
  const sp=flying?(run?80:28):(run?14:6.5);
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const tx=(fx*f+rx*s)*sp+fx*glide,tz=(fz*f+rz*s)*sp+fz*glide;
  const a=1-Math.exp(-(flying?4:9)*dt);vel.x+=(tx-vel.x)*a;vel.z+=(tz-vel.z)*a;
  glide*=Math.exp(-2.5*dt);if(Math.abs(glide)<.05)glide=0;
  player.x+=vel.x*dt;player.z+=vel.z*dt;
  if(flying){vel.y+=(clamp(u,-1,1)*(run?45:16)-vel.y)*a;player.y=clamp(player.y+vel.y*dt,1.7,700);}
  collide(player,player.y);
  groundY+=((onLot(player.x,player.z)?.25:0)-groundY)*(1-Math.exp(-14*dt));
  if(!flying)player.y=groundY+1.7;
  const spd=Math.hypot(vel.x,vel.z);bob+=spd*dt*1.15;
  const b=reduceMotion||flying?0:Math.sin(bob*2)*.05*Math.min(spd/6.5,1.4);
  camera.position.set(player.x,player.y+b,player.z);camera.rotation.set(pitch,yaw,flying?clamp(-(vel.x*rx+vel.z*rz)*.004,-.15,.15):0);
}

/* ---------- loot ---------- */
let found=0;
const LOOT=['canned food','water jug','med kit','battery pack','scrap metal','fuel can','radio parts','rope','filters','tool kit'];
function checkLoot(){
  for(let i=0;i<crateState.length;i++){const c=crateState[i];if(c.got)continue;const dx=c.x-player.x,dz=c.z-player.z;
    if(dx*dx+dz*dz<4&&player.y<4){c.got=true;found++;crateMesh.setMatrixAt(i,new THREE.Matrix4().makeScale(0,0,0));crateMesh.instanceMatrix.needsUpdate=true;
      const bp=crateBeacon.geometry.attributes.position;bp.setY(i,-999);bp.needsUpdate=true;
      toast('Found '+pick(LOOT));$('lootv').innerHTML='<b>'+found+'</b> / '+crateState.length;}}
}

/* ---------- HUD ---------- */
const strip=$('strip'),PX=2;let compassW=200;
(function(){let h='';const names={0:'N',45:'NE',90:'E',135:'SE',180:'S',225:'SW',270:'W',315:'NW'};
  for(let d=-360;d<=720;d+=15){const nd=((d%360)+360)%360,lb=names[nd];
    h+=lb?`<span class="${lb.length===1?'card'+(lb==='N'?' n':''):'ord'}" style="left:${(d+360)*PX}px">${lb}</span>`:`<span class="tick" style="left:${(d+360)*PX}px"></span>`;}
  strip.innerHTML=h;})();
$('lootv').innerHTML='<b>0</b> / '+crateState.length;
let toastT=0;function toast(t){$('toast').textContent=t;$('toast').classList.add('on');toastT=2.4;}
const aveName=k=>AVES[clamp(k+N,0,AVES.length-1)]+' Ave',stName=l=>ord(l+N+1)+' St';
let hudT=0,lastKey='';
function hud(dt){
  const heading=((-yaw*180/Math.PI)%360+360)%360;
  strip.style.transform=`translateX(${compassW/2-(heading+360)*PX}px)`;
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('on');}
  hudT+=dt;if(hudT<.15)return;hudT=0;
  $('clock').textContent=clockText();
  const k=Math.round(player.x/CELL),l=Math.round(player.z/CELL),dx=Math.abs(player.x-k*CELL),dz=Math.abs(player.z-l*CELL);
  const bi=Math.floor(player.x/CELL),bj=Math.floor(player.z/CELL),out=Math.abs(player.x)>EXT+6||Math.abs(player.z)>EXT+6;
  const dist=out?'outskirts':lotType[bi+','+bj]||'outskirts',lm=lmAt[bi+','+bj];
  let st,sub;
  if(out){st='Outer wastes';sub='city limits · head back toward the streets';}
  else if(dx<ROAD/2+1&&dz<ROAD/2+1){st=`${aveName(k)} & ${stName(l)}`;sub='intersection';}
  else if(dx<ROAD/2+1){st=aveName(k);sub=`between ${stName(Math.floor(player.z/CELL))} & ${stName(Math.floor(player.z/CELL)+1)}`;}
  else if(dz<ROAD/2+1){st=stName(l);sub=`between ${aveName(Math.floor(player.x/CELL))} & ${aveName(Math.floor(player.x/CELL)+1)}`;}
  else{st=lm?{church:'St. Brigid Church',clocktower:'Old Clock Tower',stadium:'Municipal Stadium',gasstation:'Fuel Stop',theater:'Palace Theater',watertower:'Water Works',radiomast:'Radio Mast',ferris:'Pier Park Wheel',monument:'Founders Monument',library:'Public Library'}[lm]:'Block off '+aveName(k);sub=lm?'landmark':`near ${stName(l)}`;}
  if(flying)sub=Math.round(player.y)+' m up · '+sub;
  const key=dist+st+sub;if(key!==lastKey){lastKey=key;$('district').textContent=DNAME[dist];$('street').textContent=st;$('sub').textContent=sub;}
}
const hint=$('hint');
hint.textContent=coarse?'Left thumb walks · right thumb looks · FLY to take off · walk into glowing crates to collect supplies':'Mouse to look (click to lock, Esc to release) · WASD walk · Shift run · G or FLY to take off · find the glowing crates';
let hintGone=false;function dismissHint(){if(hintGone)return;hintGone=true;setTimeout(()=>hint.classList.add('gone'),2500);}
setTimeout(dismissHint,8000);

/* ---------- loop ---------- */
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();compassW=strip.parentElement.clientWidth;}
addEventListener('resize',resize);resize();
let last=performance.now(),t=0,lightT=0;
function updateLights(t){
  for(let i=0;i<tlLamps.length;i++){const L=tlLamps[i];let r=0,g=0,b=0;
    if(L.mode==='amber'){const on=Math.sin(t*3.6+L.ph)>0?2.4:0;r=on;g=on*.62;}else if(L.mode==='red'){r=2.4;g=.18;}
    tlCol[i*3]=r;tlCol[i*3+1]=g;tlCol[i*3+2]=b;}
  tlGeo.attributes.color.needsUpdate=true;
}
applyTime();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  tod=(tod+dt*24/CYCLE)%24;
  step(dt);checkLoot();
  lightT+=dt;if(lightT>.1){lightT=0;applyTime();updateLights(t);}
  sky.position.copy(camera.position);stars.position.copy(camera.position);
  moon.position.copy(camera.position).addScaledVector(sunDir,-1900);
  sun.position.copy(player).addScaledVector(sunDir,400);sun.target.position.copy(player);
  moonLight.position.copy(player).addScaledVector(sunDir,-400);moonLight.target.position.copy(player);
  for(let i=0;i<DUST;i++){const o=i*3;dustPos[o]+=(Math.sin(t*.4+dustSeed[i])*.3+.25)*dt;dustPos[o+1]-=(.15+dustSeed[i]*.02)*dt;dustPos[o+2]+=Math.cos(t*.3+dustSeed[i])*.2*dt;
    if(dustPos[o+1]<player.y-15)dustPos[o+1]+=dustH;if(dustPos[o+1]>player.y+15)dustPos[o+1]-=dustH;
    if(dustPos[o]-player.x>dustBox)dustPos[o]-=dustBox*2;else if(dustPos[o]-player.x<-dustBox)dustPos[o]+=dustBox*2;
    if(dustPos[o+2]-player.z>dustBox)dustPos[o+2]-=dustBox*2;else if(dustPos[o+2]-player.z<-dustBox)dustPos[o+2]+=dustBox*2;}
  dustGeo.attributes.position.needsUpdate=true;
  crateBeacon.material.opacity=.55+.45*Math.sin(t*3);
  hud(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
